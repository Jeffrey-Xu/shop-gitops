name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          # 目录名和服务名不一致（fulfillment-service → fulfillment），
          # 所以 context 得单独给，不能靠 name 拼
          - name: fulfillment
            context: fulfillment-service
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 镜像前缀转小写
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Apple Silicon 本地集群是 arm64，CI runner 是 amd64，必须多架构
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 把镜像 tag 改成当前 commit sha
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Docker tag 必须小写，GitHub 用户名 Jeffrey-Xu 是混合大小写
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          # payment（Python）故意不在列表里：它的镜像还是本地 local1，
          # 等它的依赖打包也走 CI 了再加进来
          for svc in backend frontend fulfillment; do
            yq -i "(.images[] | select(.name == \"${PREFIX}/${svc}\") | .newTag) = \"${SHA}\"" deploy/kustomization.yaml
          done
          echo "--- 结果 ---"
          yq '.images' deploy/kustomization.yaml

      - name: 提交回仓库
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(deploy): bump images to ${{ github.sha }} [skip ci]"
          git push
