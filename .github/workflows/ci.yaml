name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          # 目录名和服务名不一致（fulfillment-service → fulfillment），
          # 所以 context 得单独给，不能靠 name 拼
          - name: fulfillment
            context: fulfillment-service
          # payment 是 Python，之前一直是本地 build + 手工 import 的 local2，
          # 后果是「改了 payment-service 代码但 CI 不重建」——集群里跑着旧代码
          # 而 repo 里是新代码。退款就踩在这上面：加 /refund 之后不改这里，
          # 集群的 payment Pod 永远返回 404。
          - name: payment
            context: payment-service
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 镜像前缀转小写
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Apple Silicon 本地集群是 arm64，CI runner 是 amd64，必须多架构
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    # 两次 push 挨得近时，两个 bump 会各改同一个文件，后推的必然被
    # `! [rejected] main -> main (fetch first)` 打回。串行化 bump：
    # 后来的排队（pending 只有一个位，新的顶掉旧的——这正是想要的，
    # 最新的 sha 才是该生效的那个）；cancel-in-progress=false 保证
    # 正在跑的那个不会被拦腰掐断。
    concurrency:
      group: bump-deploy
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 把镜像 tag 改成当前 commit sha
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Docker tag 必须小写，GitHub 用户名 Jeffrey-Xu 是混合大小写
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          for svc in backend frontend fulfillment payment; do
            yq -i "(.images[] | select(.name == \"${PREFIX}/${svc}\") | .newTag) = \"${SHA}\"" deploy/kustomization.yaml
          done
          echo "--- 结果 ---"
          yq '.images' deploy/kustomization.yaml

      - name: 提交回仓库
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          subst() {
            for svc in backend frontend fulfillment payment; do
              yq -i "(.images[] | select(.name == \"${PREFIX}/${svc}\") | .newTag) = \"${SHA}\"" deploy/kustomization.yaml
            done
          }

          # 返回 1 表示没有变化（重跑同一个 sha 时会这样）
          try_commit() {
            git add deploy/kustomization.yaml
            git diff --staged --quiet && return 1
            git commit -m "chore(deploy): bump images to ${SHA} [skip ci]"
          }

          for i in 1 2 3 4 5; do
            if ! try_commit; then
              echo "没有变化，跳过提交"
              exit 0
            fi
            if git push; then
              echo "推送成功（第 ${i} 次尝试）"
              exit 0
            fi

            # 被拒说明远端又前进了（另一个 bump 刚落地）。硬对齐远端再重算一次
            # tag：`reset --hard` 会丢掉上一步的替换，所以 subst 必须重跑。
            echo "第 ${i} 次推送被拒，对齐远端后重试"
            git fetch origin main
            git reset --hard origin/main
            subst
            sleep $((i * 3))
          done
          echo "重试 5 次仍失败，请人工处理"
          exit 1
