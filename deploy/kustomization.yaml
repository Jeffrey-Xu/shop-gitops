apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - namespace.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - payment.yaml
  # 账号服务（Go）与履约服务（Node）是这一轮新增的两个角色
  - account.yaml
  - fulfillment.yaml
  - ingress.yaml
  # 告警规则；ServiceMonitor 跟着各自的服务放在 api.yaml / worker.yaml 里
  - monitoring.yaml
# CI 会改写这里，把 tag 换成当前 commit sha
# api / worker / account 用的是同一个 backend 镜像，所以只需要一条
images:
  # paywiring1 = 本地交叉编译的补丁镜像（Docker Hub 挂了，拉不到 golang 基础镜像），
  # 内容等价于 backend 主干 + payment 客户端接线。
  # fulfill1 = 加了 account 二进制的那一版（同样走本地交叉编译打包）。
  - name: ghcr.io/jeffrey-xu/shop-gitops/backend
    newTag: ffbfcf55b8c9e043d7ec6f102d78d2fdd20e4d9d
  - name: ghcr.io/jeffrey-xu/shop-gitops/frontend
    newTag: ffbfcf55b8c9e043d7ec6f102d78d2fdd20e4d9d
  # 支付服务是 Python，不在 CI 矩阵里（见 ci.yaml 的说明），镜像是本地 docker build 出来的。
  # local2 = 加了 OTel 埋点（FastAPI 自动埋点 + OTLP 导出）的那一版。
  # 改动 payment-service/ 之后必须重新 build 并改这里的 tag —— CI 不会帮你做这件事，
  # 这正是本地镜像和服务代码容易悄悄脱节的地方。
  - name: ghcr.io/jeffrey-xu/shop-gitops/payment
    newTag: local2
  # 履约服务是 Node，镜像单独构建
  - name: ghcr.io/jeffrey-xu/shop-gitops/fulfillment
    newTag: ffbfcf55b8c9e043d7ec6f102d78d2fdd20e4d9d
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
