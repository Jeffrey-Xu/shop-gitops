apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - namespace.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml
  # 告警规则；ServiceMonitor 跟着各自的服务放在 api.yaml / worker.yaml 里
  - monitoring.yaml
# CI 会改写这里，把 tag 换成当前 commit sha
# api 和 worker 用的是同一个 backend 镜像，所以只需要两条
images:
  - name: ghcr.io/jeffrey-xu/shop-gitops/backend
    newTag: 0364df2aba609ac99e275deeff6db16fd690ba79
  - name: ghcr.io/jeffrey-xu/shop-gitops/frontend
    newTag: 0364df2aba609ac99e275deeff6db16fd690ba79
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
