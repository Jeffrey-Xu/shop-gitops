apiVersion: v1
kind: Secret
metadata:
  name: shop-secret
  labels:
    app.kubernetes.io/part-of: shop
type: Opaque
stringData:
  # 指向宿主机的 Homebrew PostgreSQL 18（不是集群内的库）
  # host.docker.internal 由 Docker Desktop 注入，Pod 内可直接解析到 192.168.65.254
  database-url: "postgres://shop:shop@host.docker.internal:5432/shop?sslmode=disable"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  labels:
    app.kubernetes.io/part-of: shop
data:
  APP_VERSION: "v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 单副本 + 本地学习：用 Recreate，避免滚动更新时临时起第二个 Pod
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/jeffrey-xu/shop-gitops/backend:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            # 连接串含口令，放 Secret；同名 env 优先级高于 envFrom
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: database-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
