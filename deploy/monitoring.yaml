apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
    # ruleSelector 同样只认这个标签
    release: kube-prometheus-stack
spec:
  groups:
    - name: shop.api
      rules:
        - alert: ShopApiHighErrorRate
          expr: |
            sum(rate(shop_http_requests_total{status=~"5.."}[5m]))
              /
            sum(rate(shop_http_requests_total[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "api 5xx 比例超过 5%"
            description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}，先看 Loki 里 level=error 的 request_id"

        - alert: ShopQueueBacklog
          expr: shop_queue_messages{queue="shop.order.created"} > 10
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "订单主队列积压超过 10 条"
            description: "worker 可能挂了或消费太慢；队列 {{ $labels.queue }} 当前 {{ $value }} 条"

        # DLQ 非空 = 有订单走到了「放弃重试」这一步，必须有人看。
        # 这条比任何 5xx 告警都重要：主队列是空的、大盘是绿的、
        # 用户的钱已经扣了，而消息躺在 DLQ 里没人管。
        - alert: ShopDlqNotEmpty
          expr: sum(shop_queue_messages{queue=~".+\\.dlq"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "死信队列里有消息"
            description: "{{ $value }} 条消息进入 DLQ。先看 Loki 里带 attempts 与 last_error 的日志，确认原因后用 cmd/replay 重投"

        # 年龄和计数看的是两件事：计数高但年龄小 = 吞吐跟不上（warning 够了）；
        # 年龄单调增长 = 投递链路卡住了，计数可能还是个位数。
        # relay 正常时这个值应该只有几秒（一个轮询周期）。
        - alert: ShopOutboxStuckByAge
          expr: shop_outbox_oldest_seconds > 60
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "最老一条 outbox 消息已等待 {{ $value | humanizeDuration }}"
            description: "投递链路卡住。若是 broker 连不上，relay 会一直重试同一条；检查 RabbitMQ 连接与 relay 日志"

        - alert: ShopOutboxPending
          expr: shop_outbox_pending > 20
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "outbox 积压 {{ $value }} 行"
            description: "量上来了但还没卡死（年龄告警未触发）。先看下单速率与 relay 的 publish 耗时"

        # dead 和 pending 是两个相反的信号：pending 高说明「还在努力」，
        # dead > 0 说明 relay 已经放弃某条消息 —— 一次下单事件永久丢失，
        # 下游永远不会收到，只能靠 backfill 或人工补。
        # 这条必须独立存在：把死信算进 pending，pending 就永远降不下来。
        - alert: ShopOutboxDead
          expr: shop_outbox_dead > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} 条 outbox 消息已被放弃投递"
            description: "订单事件永久丢失（下游收不到）。看 outbox.last_error 与 relay 日志定位原因，修好后用 cmd/backfill 补发"

        # 对账差异。指标本身只统计「超过 2 分钟宽限期」的单，
        # 所以这里 for: 1m 已经意味着「至少卡了 3 分钟」，足够排除正在处理的。
        #
        # 为什么单独拎出来而不并进 DLQ 告警：DLQ 空了也可能是这种状态 ——
        # 消息被 replay 过、被 ack 掉了，钱却始终没落成订单。
        # 队列看得见「消息」，看不见「钱」。
        - alert: ShopPaymentMismatch
          expr: sum(shop_payment_mismatch{kind=~"stuck_paid|paid_but_cancelled"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} 单的钱和订单状态对不上"
            description: "stuck_paid = 已扣款但订单还 CREATED（货不发）；paid_but_cancelled = 已扣款但订单已作废（钱不退）。先跑 kubectl exec deploy/api -- /app/reconcile 看明细，再决定 -apply / -refund"

        - alert: ShopPaymentLedgerMismatch
          expr: sum(shop_payment_mismatch{kind=~"amount_mismatch|paid_but_declined|stuck_unpaid"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} 单的账实不符（金额、扣款结果或根本没扣款）"
            description: "amount_mismatch = 扣款金额≠订单金额；paid_but_declined = 订单 PAID 但网关 failed；stuck_unpaid = 订单停在 CREATED 且网关查无此单（消息丢了或 worker 没跑到）。这三类都不自动处置"
