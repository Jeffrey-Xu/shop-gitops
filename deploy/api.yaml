apiVersion: v1
kind: Secret
metadata:
  name: shop-secret
  labels:
    app.kubernetes.io/part-of: shop
type: Opaque
stringData:
  # 指向宿主机的 Homebrew PostgreSQL 18（不是集群内的库）
  # host.docker.internal 由 Docker Desktop 注入，Pod 内解析到 192.168.65.254
  database-url: "postgres://shop:shop@host.docker.internal:5432/shop?sslmode=disable"
  # vhost 是 /shop，必须编码成 %2F，否则会被当成路径
  rabbitmq-url: "amqp://shop:shoppass@host.docker.internal:5672/%2Fshop"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  labels:
    app.kubernetes.io/part-of: shop
data:
  APP_VERSION: "v2"
  LOG_LEVEL: "info"
  CACHE_TTL: "30s"
  # 打开后才注册 /api/dev/fault（演示错误率和日志链路用）
  DEV_MODE: "true"
  REDIS_ADDR: "host.docker.internal:6379"
  MQ_PREFETCH: "5"
  MQ_MAX_ATTEMPTS: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 单副本 + 本地学习：用 Recreate，避免滚动更新时临时起第二个 Pod
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/jeffrey-xu/shop-gitops/backend:bootstrap
          imagePullPolicy: IfNotPresent
          # 和 worker 同一个镜像，靠 command 区分角色
          command: ["/app/api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            # 连接串含口令，放 Secret；同名 env 优先级高于 envFrom
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: rabbitmq-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: shop
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ServiceMonitor 必须带 release=kube-prometheus-stack 标签，
# 因为 Prometheus 的 serviceMonitorSelector 就是 matchLabels 这个值，
# 少一个标签就是静默不抓，连报错都没有。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels:
    app: api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
