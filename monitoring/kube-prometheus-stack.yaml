# 指标 + 告警 + 大盘，一套装完
# 精简原则：单副本、关掉 Docker Desktop 上抓不到的 target、限制 retention
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.4.0
    helm:
      valuesObject:
        # ---- 关键：这四个在 Docker Desktop 里跑在容器内，端口没暴露 ----
        # 不关掉就是永久 TargetDown，告警从第一天起全是红的
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        # 对应的告警规则也一起关，否则还是会 fire
        defaultRules:
          create: true
          rules:
            etcd: false
            kubeControllerManager: false
            kubeScheduler: false
            kubeProxy: false
            alertmanager: true
            kubeApiserverAvailability: false

        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 7d
            retentionSize: 4GB
            # 单副本不重建 PVC，删了数据就没了，本地可接受
            resources:
              requests:
                cpu: 100m
                memory: 350Mi
              limits:
                memory: 1200Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 8Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1
            resources:
              requests:
                cpu: 10m
                memory: 40Mi
              limits:
                memory: 120Mi

        grafana:
          enabled: true
          adminPassword: admin
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              memory: 400Mi
          # 用 Host 而不是 path 前缀，避开 root_url / serve_from_sub_path 那堆坑
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.localhost
            path: /
          # Loki 后装也行，datasource 指向不存在的服务不会让 Grafana 起不来
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki-gateway.monitoring.svc.cluster.local
              access: proxy
              isDefault: false
              jsonData:
                maxLines: 1000

        kube-state-metrics:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              memory: 150Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 60Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              memory: 250Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
