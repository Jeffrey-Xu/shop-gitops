# 日志：单机模式，filesystem 存储，不接对象存储
# 关掉 memcached / canary / helm test 这些本地用不上的
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.6.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
            path_prefix: /var/loki
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            # 之前是 0（永久保留），磁盘只会涨不会落。
            # 168h = 7 天，和 Prometheus 的 retention 对齐，排查窗口一致。
            # 注意：retention_period 只是“标记可删”，真正执行删除的是 compactor，
            # 所以下面还必须开 retention_enabled 并指定 delete_request_store。
            retention_period: 168h
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            allow_structured_metadata: true
            volume_enabled: true
          # 删除动作的实际执行者。少任何一个字段 Loki 都会启动失败：
          # delete_request_store 未配置时报 "invalid compactor config"
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
            compaction_interval: 10m
            retention_delete_delay: 2h

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              memory: 700Mi
          persistence:
            enabled: true
            size: 10Gi
            storageClass: standard

        # SimpleScalable 模式的读写分离组件全部关掉
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # 省内存的大头：两个 memcached 缓存各占 100-200MB，本地不需要
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

        # gateway 留着：Grafana 数据源和 Alloy 的推送地址都指向它，比直连 svc 更稳
        gateway:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 80Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
