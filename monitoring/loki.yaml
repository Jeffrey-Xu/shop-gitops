# 日志：单机模式，filesystem 存储，不接对象存储
# 关掉 memcached / canary / helm test 这些本地用不上的
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.6.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
            path_prefix: /var/loki
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            # 0 = 永久保留。本地磁盘 940G 空余，先不折腾 compactor 删数据那条链
            retention_period: 0
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            allow_structured_metadata: true
            volume_enabled: true

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              memory: 700Mi
          persistence:
            enabled: true
            size: 10Gi
            storageClass: standard

        # SimpleScalable 模式的读写分离组件全部关掉
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # 省内存的大头：两个 memcached 缓存各占 100-200MB，本地不需要
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

        # gateway 留着：Grafana 数据源和 Alloy 的推送地址都指向它，比直连 svc 更稳
        gateway:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              memory: 80Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
