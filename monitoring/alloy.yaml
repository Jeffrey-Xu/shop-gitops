# 日志采集：DaemonSet 形态，每个节点一个
# 用 loki.source.kubernetes 走 API 读 pod 日志（chart 的 ClusterRole 已含 pods/log），
# 不需要挂 hostPath /var/log/containers —— 少一层对宿主机路径的依赖
#
# 注意：下面 content 里是 Alloy 自己的配置语言（River），注释只能用 // 或 /* */，
# 用 # 会让 Alloy 报 "illegal character U+0023" 并静默保留旧配置（ArgoCD 仍显示 Healthy）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      valuesObject:
        controller:
          type: daemonset
          # Docker Desktop 的 control-plane 带 NoSchedule 污点，
          # 不容忍就只剩 1 个副本，控制面（etcd/apiserver）的日志会漏采
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

        alloy:
          resources:
            requests:
              cpu: 20m
              memory: 60Mi
            limits:
              memory: 200Mi
          configMap:
            create: true
            content: |-
              logging {
                level  = "info"
                format = "logfmt"
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                // 我们自己的工作负载用的是简写 label app，不是 k8s 推荐的
                // app.kubernetes.io/name，所以两条都要有，后者覆盖前者
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator    = "/"
                  target_label = "job"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.pipeline.receiver]
              }

              loki.process "pipeline" {
                stage.cri {}

                // 后端输出的是 slog JSON，这里解析成结构化字段：
                // level 提成 label（基数只有 5 个，可以当索引）
                // request_id / order_id 放 structured metadata（不建索引但可按等值过滤）
                stage.json {
                  expressions = {
                    level = "level",
                    msg   = "msg",
                  }
                }

                stage.labels {
                  values = {
                    level = "",
                  }
                }

                stage.structured_metadata {
                  values = {
                    request_id = "request_id",
                    order_id   = "order_id",
                    service    = "service",
                  }
                }

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }

        configReloader:
          resources:
            requests:
              cpu: 5m
              memory: 20Mi
            limits:
              memory: 60Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
