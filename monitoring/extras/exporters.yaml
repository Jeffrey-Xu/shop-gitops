# 宿主机中间件指标：PG / Redis 跑在 macOS 上（brew services），不在集群里，
# 所以用 exporter 以 Pod 形态去 host.docker.internal 抓，再让 Prometheus 抓 exporter。
# RabbitMQ 自带 /metrics（15692），不需要 exporter，用 additionalScrapeConfigs 直连，见 kube-prometheus-stack.yaml
#
# 为什么不是直接在 Prometheus 里配 static_config 抓 5432：PG 本身不吐 Prometheus 格式。
apiVersion: v1
kind: Secret
metadata:
  name: exporter-credentials
  labels:
    app.kubernetes.io/part-of: monitoring
stringData:
  DATA_SOURCE_NAME: "postgresql://shop:shop@host.docker.internal:5432/shop?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: exporter-credentials
                  key: DATA_SOURCE_NAME
            # 自动发现 shop 库以外的数据库（shop_dev 也一起抓）
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
          ports:
            - name: http
              containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0
          env:
            - name: REDIS_ADDR
              value: "redis://host.docker.internal:6379"
          ports:
            - name: http
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - name: http
      port: 9121
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
